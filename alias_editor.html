<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>别称编辑器 - Project Sekai 2DMV Database</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d28;
      --bg-card: #222538;
      --bg-hover: #2a2e44;
      --bg-input: #181b26;
      --border: #2e3348;
      --text-primary: #e8eaf0;
      --text-secondary: #9498ad;
      --text-muted: #6b7089;
      --accent-blue: #5b8af5;
      --accent-purple: #9b6dff;
      --accent-pink: #f06595;
      --accent-cyan: #38d9e8;
      --accent-green: #51cf7d;
      --accent-orange: #f5a623;
      --accent-red: #ff6b6b;
      --radius: 8px;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1d2e 0%, #252a40 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--bg-hover); }

    .btn-primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn-primary:hover { background: #4a7ae0; }

    .btn-success {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #fff;
    }

    .btn-success:hover { background: #43b86a; }

    .btn-danger {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    .btn-danger:hover { background: #e05555; }

    .header-nav {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .nav-link:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      background: #1a1f38;
    }

    .nav-link.active {
      background: rgba(91, 138, 245, 0.15);
      border-color: rgba(91, 138, 245, 0.3);
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: calc(100vh - 60px);
    }

    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .panel-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* Search */
    .search-box {
      padding: 0 12px 12px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus { border-color: var(--accent-blue); }
    .search-box input::placeholder { color: var(--text-muted); }

    /* Song list */
    .song-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.1s;
    }

    .song-item:hover { background: var(--bg-hover); }

    .song-item.selected {
      background: rgba(91, 138, 245, 0.15);
      border-left: 3px solid var(--accent-blue);
    }

    .song-item .sid {
      color: var(--text-muted);
      font-size: 11px;
      min-width: 36px;
      text-align: right;
    }

    .song-item .stitle {
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .song-item .alias-count {
      background: var(--accent-purple);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .song-item .alias-count.empty { background: var(--border); color: var(--text-muted); }

    /* Editor panel */
    .editor-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 40px;
      line-height: 1.8;
    }

    .editor-content { padding: 4px; }

    .selected-song-info {
      background: var(--bg-card);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .selected-song-info .song-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .selected-song-info .song-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Alias tags */
    .alias-section {
      margin-bottom: 16px;
    }

    .alias-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .alias-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
    }

    .alias-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: rgba(155, 109, 255, 0.15);
      border: 1px solid rgba(155, 109, 255, 0.3);
      border-radius: 16px;
      font-size: 13px;
      color: var(--accent-purple);
      animation: tagIn 0.2s ease;
    }

    @keyframes tagIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .alias-tag .remove-btn {
      background: none;
      border: none;
      color: var(--accent-red);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      opacity: 0.6;
      transition: opacity 0.15s;
    }

    .alias-tag .remove-btn:hover { opacity: 1; }

    .no-aliases {
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
    }

    /* Add alias input */
    .add-alias-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .add-alias-row input {
      flex: 1;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-alias-row input:focus { border-color: var(--accent-purple); }
    .add-alias-row input::placeholder { color: var(--text-muted); }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stats-bar .stat-num {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: var(--bg-card);
      border: 1px solid var(--accent-green);
      border-radius: 8px;
      color: var(--accent-green);
      font-size: 13px;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 200;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Import modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 500px;
      max-width: 90vw;
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .modal textarea {
      width: 100%;
      height: 200px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 12px;
      outline: none;
      resize: vertical;
    }

    .modal textarea:focus { border-color: var(--accent-blue); }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <h1>✏️ 别称编辑器</h1>
      <div class="header-nav">
        <a class="nav-link" href="index.html">🎵 歌曲列表</a>
        <a class="nav-link" href="video_viewer.html">📺 视频列表</a>
      </div>
      <div class="stats-bar">
        <span>歌曲 <span class="stat-num" id="stat-total">-</span></span>
        <span>已设别称 <span class="stat-num" id="stat-aliased">-</span></span>
        <span>总别称数 <span class="stat-num" id="stat-aliases">-</span></span>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="showImportModal()">📥 导入</button>
        <button class="btn btn-success" onclick="exportAliases()">💾 导出 JSON</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Left: Song list -->
    <div class="panel">
      <div class="panel-header">
        <h2>🎵 歌曲列表</h2>
      </div>
      <div class="search-box" style="padding-top:12px">
        <input type="text" id="song-search" placeholder="搜索歌名、ID..." autocomplete="off">
      </div>
      <div class="panel-body" id="song-list-container">
        <div class="editor-empty">加载中...</div>
      </div>
    </div>

    <!-- Right: Alias editor -->
    <div class="panel">
      <div class="panel-header">
        <h2>📝 别称编辑</h2>
      </div>
      <div class="panel-body" id="editor-container">
        <div class="editor-empty">
          ← 从左侧选择一首歌曲<br>即可编辑其别称
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Import modal -->
  <div class="modal-overlay" id="import-modal">
    <div class="modal">
      <h3>📥 导入别称数据</h3>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">
        粘贴 aliases.json 内容，将与现有数据合并（不会覆盖已有别称）
      </p>
      <textarea id="import-textarea" placeholder='{"1": ["TYW", "告诉你的世界"], ...}'></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="closeImportModal()">取消</button>
        <button class="btn btn-primary" onclick="doImport()">导入合并</button>
        <button class="btn btn-danger" onclick="doImportReplace()">导入替换</button>
      </div>
    </div>
  </div>

  <script>
    let songs = [];
    let aliases = {};
    let selectedId = null;
    let searchQuery = '';

    // ============ Data Loading ============

    async function loadData() {
      try {
        const resp = await fetch('output/combined_music_data.json');
        songs = await resp.json();
      } catch (e) {
        document.getElementById('song-list-container').innerHTML =
          `<div class="editor-empty">❌ 无法加载歌曲数据<br><small>${e.message}</small></div>`;
        return;
      }

      // Try to load existing aliases
      try {
        const aliasResp = await fetch('output/aliases.json');
        aliases = await aliasResp.json();
      } catch (e) {
        aliases = {};
      }

      updateStats();
      renderSongList();
    }

    // ============ Song List ============

    function renderSongList() {
      const container = document.getElementById('song-list-container');
      const q = searchQuery.toLowerCase().trim();

      let filtered = songs;
      if (q) {
        filtered = songs.filter(s => {
          if (String(s.id) === q) return true;
          if ((s.title || '').toLowerCase().includes(q)) return true;
          if ((s.creators?.creatorArtistName || '').toLowerCase().includes(q)) return true;
          // Also search aliases
          const songAliases = aliases[String(s.id)] || [];
          if (songAliases.some(a => a.toLowerCase().includes(q))) return true;
          return false;
        });
      }

      if (!filtered.length) {
        container.innerHTML = '<div class="editor-empty">没有匹配的歌曲</div>';
        return;
      }

      container.innerHTML = filtered.map(s => {
        const count = (aliases[String(s.id)] || []).length;
        const isSelected = s.id === selectedId;
        return `<div class="song-item${isSelected ? ' selected' : ''}" data-id="${s.id}">
          <span class="sid">#${s.id}</span>
          <span class="stitle">${esc(s.title)}</span>
          ${count > 0
            ? `<span class="alias-count">${count}</span>`
            : `<span class="alias-count empty">0</span>`
          }
        </div>`;
      }).join('');

      // Bind clicks
      container.querySelectorAll('.song-item').forEach(el => {
        el.addEventListener('click', () => {
          selectedId = parseInt(el.dataset.id);
          renderSongList();
          renderEditor();
        });
      });
    }

    // ============ Editor ============

    function renderEditor() {
      const container = document.getElementById('editor-container');
      if (selectedId === null) {
        container.innerHTML = '<div class="editor-empty">← 从左侧选择一首歌曲<br>即可编辑其别称</div>';
        return;
      }

      const song = songs.find(s => s.id === selectedId);
      if (!song) return;

      const currentAliases = aliases[String(selectedId)] || [];

      container.innerHTML = `
        <div class="editor-content">
          <div class="selected-song-info">
            <div class="song-name">${esc(song.title)}</div>
            <div class="song-meta">
              ID: ${song.id} · ${esc(song.creators?.creatorArtistName || '-')}
            </div>
          </div>

          <div class="alias-section">
            <div class="alias-label">当前别称 (${currentAliases.length})</div>
            <div class="alias-tags" id="alias-tags">
              ${currentAliases.length === 0
                ? '<span class="no-aliases">暂无别称，在下方输入添加</span>'
                : currentAliases.map((a, i) => `
                  <span class="alias-tag">
                    ${esc(a)}
                    <button class="remove-btn" data-index="${i}" title="删除">✕</button>
                  </span>
                `).join('')
              }
            </div>
          </div>

          <div class="alias-section">
            <div class="alias-label">添加别称</div>
            <div class="add-alias-row">
              <input type="text" id="alias-input" placeholder="输入别称后按 Enter 添加..." autocomplete="off">
              <button class="btn btn-primary" onclick="addAliasFromInput()">添加</button>
            </div>
          </div>

          <div style="margin-top:16px;display:flex;gap:8px">
            <button class="btn btn-danger" onclick="clearAliases()" ${currentAliases.length === 0 ? 'disabled style="opacity:0.4;cursor:default"' : ''}>
              🗑️ 清空此歌别称
            </button>
          </div>
        </div>
      `;

      // Bind remove buttons
      container.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.index);
          removeAlias(idx);
        });
      });

      // Bind enter key on input
      const input = document.getElementById('alias-input');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addAliasFromInput();
        }
      });

      // Auto focus
      input.focus();
    }

    function addAliasFromInput() {
      const input = document.getElementById('alias-input');
      const val = input.value.trim();
      if (!val || selectedId === null) return;

      const key = String(selectedId);
      if (!aliases[key]) aliases[key] = [];

      // Prevent duplicates
      if (aliases[key].some(a => a.toLowerCase() === val.toLowerCase())) {
        showToast('⚠️ 该别称已存在');
        return;
      }

      aliases[key].push(val);
      input.value = '';
      renderEditor();
      renderSongList();
      updateStats();
      showToast(`✅ 已添加别称「${val}」`);
    }

    function removeAlias(index) {
      const key = String(selectedId);
      if (!aliases[key]) return;
      const removed = aliases[key].splice(index, 1)[0];
      if (aliases[key].length === 0) delete aliases[key];
      renderEditor();
      renderSongList();
      updateStats();
      showToast(`🗑️ 已删除别称「${removed}」`);
    }

    function clearAliases() {
      const key = String(selectedId);
      delete aliases[key];
      renderEditor();
      renderSongList();
      updateStats();
      showToast('🗑️ 已清空该歌曲的所有别称');
    }

    // ============ Import / Export ============

    function exportAliases() {
      // Sort keys numerically
      const sorted = {};
      Object.keys(aliases)
        .sort((a, b) => parseInt(a) - parseInt(b))
        .forEach(k => { sorted[k] = aliases[k]; });

      const json = JSON.stringify(sorted, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'aliases.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('💾 已导出 aliases.json');
    }

    function showImportModal() {
      document.getElementById('import-modal').classList.add('show');
      document.getElementById('import-textarea').value = '';
      document.getElementById('import-textarea').focus();
    }

    function closeImportModal() {
      document.getElementById('import-modal').classList.remove('show');
    }

    function doImport() {
      const text = document.getElementById('import-textarea').value.trim();
      if (!text) return;
      try {
        const data = JSON.parse(text);
        // Merge: add new aliases without overwriting
        let addedCount = 0;
        Object.entries(data).forEach(([id, aliasList]) => {
          if (!Array.isArray(aliasList)) return;
          if (!aliases[id]) aliases[id] = [];
          aliasList.forEach(a => {
            if (typeof a === 'string' && !aliases[id].some(existing => existing.toLowerCase() === a.toLowerCase())) {
              aliases[id].push(a);
              addedCount++;
            }
          });
        });
        closeImportModal();
        renderSongList();
        renderEditor();
        updateStats();
        showToast(`✅ 合并完成，新增 ${addedCount} 个别称`);
      } catch (e) {
        showToast('❌ JSON 格式错误: ' + e.message);
      }
    }

    function doImportReplace() {
      const text = document.getElementById('import-textarea').value.trim();
      if (!text) return;
      try {
        const data = JSON.parse(text);
        aliases = {};
        Object.entries(data).forEach(([id, aliasList]) => {
          if (Array.isArray(aliasList)) {
            aliases[id] = aliasList.filter(a => typeof a === 'string');
          }
        });
        closeImportModal();
        renderSongList();
        renderEditor();
        updateStats();
        showToast('✅ 已替换全部别称数据');
      } catch (e) {
        showToast('❌ JSON 格式错误: ' + e.message);
      }
    }

    // ============ Utilities ============

    function updateStats() {
      document.getElementById('stat-total').textContent = songs.length;
      const aliasedCount = Object.keys(aliases).length;
      document.getElementById('stat-aliased').textContent = aliasedCount;
      const totalAliases = Object.values(aliases).reduce((sum, arr) => sum + arr.length, 0);
      document.getElementById('stat-aliases').textContent = totalAliases;
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ============ Init ============

    document.getElementById('song-search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderSongList();
    });

    loadData();
  </script>
</body>

</html>
