<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频列表 - Project Sekai 2DMV Database</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f5f7fb;
      --bg-secondary: #eef3f8;
      --bg-card: #ffffff;
      --bg-hover: #f7faff;
      --bg-input: #fbfcfe;
      --border: #d8e1eb;
      --border-strong: #bcc8d6;
      --line-soft: #e9eef5;
      --text-primary: #1f2d3d;
      --text-secondary: #546476;
      --text-muted: #8391a2;
      --accent-blue: #1668dc;
      --accent-purple: #7457d8;
      --accent-pink: #cc5b87;
      --accent-cyan: #0f766e;
      --accent-green: #2f8f5b;
      --accent-orange: #c67a1c;
      --accent-red: #cf4d52;
      --tag-leo: #1769cc;
      --tag-mmj: #2e9c5d;
      --tag-vbs: #be4d7d;
      --tag-wxs: #be9323;
      --tag-n25: #6d52c7;
      --tag-vocaloid: #177f9a;
      --tag-other: #7b8795;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(31, 45, 61, 0.05);
      --shadow-soft: 0 2px 8px rgba(31, 45, 61, 0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'IBM Plex Sans SC', 'Noto Sans JP', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: linear-gradient(180deg, #ffffff 0, #f5f7fb 160px);
    }

    .header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(216, 225, 235, 0.9);
      box-shadow: 0 6px 20px rgba(31, 45, 61, 0.04);
      padding: 18px 24px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .header-kicker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid rgba(22, 104, 220, 0.12);
      border-radius: 10px;
      background: rgba(22, 104, 220, 0.05);
      color: var(--accent-blue);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .header-subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .header-nav {
      margin-left: auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .nav-link:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      background: #f8fbff;
    }

    .nav-link.active {
      background: rgba(22, 104, 220, 0.06);
      border-color: rgba(22, 104, 220, 0.28);
      color: var(--accent-blue);
      font-weight: 600;
    }

    .stats-bar {
      display: flex;
      gap: 10px;
      color: var(--text-muted);
    }

    .stats-bar .stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      font-size: 12px;
    }

    .stats-bar .stat-num {
      color: var(--accent-blue);
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 16px;
    }

    .app {
      max-width: 1540px;
      margin: 0 auto;
      display: flex;
      gap: 18px;
      min-height: calc(100vh - 88px);
      padding: 18px 24px 24px;
      align-items: flex-start;
    }

    .sidebar {
      width: 272px;
      min-width: 272px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      padding: 18px;
      position: sticky;
      top: 104px;
      height: calc(100vh - 128px);
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 10px;
      margin-top: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
    }

    .sidebar h3:first-child { margin-top: 0; }

    .filter-group { margin-bottom: 10px; }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.15s;
      user-select: none;
      border: 1px solid transparent;
      background: transparent;
    }

    .filter-item:hover {
      background: #f8fbff;
      color: var(--text-primary);
      border-color: #d7e7fb;
    }

    .filter-item.active {
      background: rgba(22, 104, 220, 0.06);
      color: var(--text-primary);
      border-color: rgba(22, 104, 220, 0.22);
      box-shadow: inset 2px 0 0 var(--accent-blue);
    }

    .filter-item input[type="checkbox"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-strong);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      background: #fff;
    }

    .filter-item input[type="checkbox"]:checked {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .filter-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: -2px;
      left: 1px;
      font-size: 11px;
      color: white;
      font-weight: 700;
    }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-bar {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .search-bar input {
      width: 100%;
      padding: 22px 42px 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-soft);
    }

    .search-bar input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(22, 104, 220, 0.08);
    }

    .search-bar input::placeholder { color: var(--text-muted); }

    .search-bar .search-icon {
      position: absolute;
      left: 16px;
      top: 58%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .search-label {
      position: absolute;
      z-index: 1;
      left: 42px;
      top: 6px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-blue);
      letter-spacing: 0.5px;
    }

    .clear-button, .sidebar-clear {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
      cursor: pointer;
    }

    .clear-button:hover, .sidebar-clear:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .clear-button:disabled { opacity: 0.45; cursor: default; }

    .filter-summary {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .filter-summary.visible { display: flex; }
    .filter-chip { padding: 4px 8px; border-radius: 999px; background: #eef5ff; color: var(--accent-blue); }
    .sidebar-clear { width: 100%; min-height: 34px; margin-bottom: 14px; }

    .results-info {
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .table-shell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--bg-card);
      overflow: hidden;
    }

    .video-row {
      display: grid;
      grid-template-columns: 84px minmax(280px, 1.5fr) 140px 130px 110px 100px 32px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-card);
      cursor: pointer;
      font-size: 13px;
      contain: content;
      border-bottom: 1px solid var(--line-soft);
    }

    .video-row:hover { background: var(--bg-hover); }
    .video-row.expanded { background: #f2f7ff; }

    .video-type-col { text-align: center; }

    .video-type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .vt-official { background: rgba(22, 104, 220, 0.12); color: var(--accent-blue); }
    .vt-original { background: rgba(199, 122, 28, 0.12); color: var(--accent-orange); }

    .video-title-col { min-width: 0; }

    .video-title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-song-name {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }

    .video-version-col {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-channel-col {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-views-col {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
    }

    .video-date-col {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
    }

    .expand-arrow {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      transition: transform 0.2s;
    }

    .video-row.expanded .expand-arrow { transform: rotate(90deg); }

    /* Detail panel */
    .video-detail {
      display: none;
      background: #f8fafd;
      border-top: 1px solid var(--line-soft);
      padding: 14px 16px 18px;
    }

    .video-detail.show { display: block; }

    .detail-section {
      margin-bottom: 12px;
    }

    .detail-section:last-child { margin-bottom: 0; }

    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-blue);
      margin-bottom: 6px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    .detail-item { font-size: 13px; }
    .detail-item .label { font-size: 11px; color: var(--text-muted); }
    .detail-item .value { color: var(--text-primary); }

    .detail-link {
      color: var(--accent-cyan);
      text-decoration: none;
      word-break: break-all;
    }

    .detail-link:hover { text-decoration: underline; }

    .detail-badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .db-video-staff {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
    }

    .staff-tag {
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(155, 109, 255, 0.08);
      color: #9b6dff;
      font-size: 10px;
    }

    /* Tags */
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .tag-light_music_club { background: rgba(77, 171, 247, 0.15); color: var(--tag-leo); }
    .tag-idol { background: rgba(105, 219, 124, 0.15); color: var(--tag-mmj); }
    .tag-street { background: rgba(240, 101, 149, 0.15); color: var(--tag-vbs); }
    .tag-theme_park { background: rgba(255, 212, 59, 0.15); color: var(--tag-wxs); }
    .tag-school_refusal { background: rgba(155, 109, 255, 0.15); color: var(--tag-n25); }
    .tag-vocaloid { background: rgba(56, 217, 232, 0.12); color: var(--tag-vocaloid); }
    .tag-other { background: rgba(134, 142, 150, 0.15); color: var(--tag-other); }

    .song-tags { display: flex; gap: 4px; flex-wrap: wrap; }

    .song-tag-preview {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .list-header {
      display: grid;
      grid-template-columns: 84px minmax(280px, 1.5fr) 140px 130px 110px 100px 32px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      background: #f7f9fc;
      border-bottom: 1px solid var(--line-soft);
      user-select: none;
    }

    .sort-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      text-align: inherit;
      cursor: pointer;
    }
    .sort-button:hover, .sort-button:focus-visible { color: var(--text-secondary); }
    .sort-indicator { font-size: 10px; }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--bg-card);
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .load-more-bar {
      text-align: center;
      padding: 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--line-soft);
    }

    .load-more-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    .load-more-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 1px solid rgba(22, 104, 220, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 28px rgba(31, 45, 61, 0.12);
      cursor: pointer;
      z-index: 120;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .back-to-top:hover {
      border-color: rgba(22, 104, 220, 0.32);
      box-shadow: 0 14px 32px rgba(22, 104, 220, 0.16);
    }

    .back-to-top-icon {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      line-height: 1;
    }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .app { padding: 12px; }
      .header-inner { flex-wrap: wrap; align-items: flex-start; }
      .header-nav { margin-left: 0; width: 100%; }
      .stats-bar { margin-left: 0; width: 100%; }
      .video-row {
        grid-template-columns: 60px 1fr 80px 80px 32px;
      }
      .list-header {
        grid-template-columns: 60px 1fr 80px 80px 32px;
      }
      .video-version-col,
      .video-channel-col,
      .video-views-col,
      .video-date-col { display: none; }
      .back-to-top { right: 16px; bottom: 18px; }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-kicker">Video Explorer</div>
        <h1>Project Sekai 2DMV Database</h1>
        <div class="header-subtitle">按视频逐个浏览，查看每条 MV 的详细信息与 Staff 阵容</div>
      </div>
      <div class="header-nav">
        <a class="nav-link" href="index.html">🎵 歌曲列表</a>
        <a class="nav-link active" href="video_viewer.html">📺 视频列表</a>
        <a class="nav-link" href="editor.html">🛠️ 编辑工具</a>
      </div>
      <div class="stats-bar">
        <div class="stat">视频 <span class="stat-num" id="stat-total">-</span></div>
        <div class="stat">已筛选 <span class="stat-num" id="stat-filtered">-</span></div>
        <div class="stat">待关联 <span class="stat-num" id="stat-unmatched">-</span></div>
      </div>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-clear" id="clear-filters-btn" type="button">清空筛选</button>
      <h3>团队 / 标签</h3>
      <div class="filter-group" id="tag-filters"></div>
      <h3>视频类型</h3>
      <div class="filter-group" id="type-filters"></div>
      <h3>视频版本</h3>
      <div class="filter-group" id="version-filters"></div>
      <h3>频道</h3>
      <div class="filter-group" id="channel-filters"></div>
    </aside>

    <main class="main">
      <div class="search-bar">
        <label class="search-label" for="search-input">搜索视频</label>
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索视频标题、歌曲名、Staff、频道..." autocomplete="off">
        <button class="clear-button" id="clear-search-btn" type="button" disabled>清空</button>
      </div>
      <div class="filter-summary" id="filter-summary" aria-live="polite"></div>
      <div class="results-info" id="results-info"></div>
      <section class="table-shell">
        <div class="list-header">
          <span role="columnheader"><button class="sort-button" data-sort="type">类型 <span class="sort-indicator" id="sort-type"></span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="title">视频标题 <span class="sort-indicator" id="sort-title"></span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="version">版本 <span class="sort-indicator" id="sort-version"></span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="channelTitle">频道 <span class="sort-indicator" id="sort-channelTitle"></span></button></span>
          <span role="columnheader" style="text-align:right"><button class="sort-button" data-sort="viewCount">播放量 <span class="sort-indicator" id="sort-viewCount"></span></button></span>
          <span role="columnheader" aria-sort="descending" style="text-align:right"><button class="sort-button" data-sort="uploadDate">上传时间 <span class="sort-indicator" id="sort-uploadDate">▼</span></button></span>
          <span></span>
        </div>
        <div id="video-list" class="video-list">
          <div class="loading">
            <div class="spinner"></div>
            <div>加载数据中...</div>
          </div>
        </div>
        <div id="load-more-bar" class="load-more-bar" style="display:none">
          <button class="load-more-btn" id="load-more-btn">加载更多</button>
        </div>
      </section>
    </main>
  </div>

  <button class="back-to-top" id="back-to-top-btn" type="button" aria-label="回到顶部">
    <span class="back-to-top-icon">↑</span>
    <span>回到顶部</span>
  </button>

  <script>
    let allVideos = [];
    let filteredVideos = [];
    let activeFilters = {
      tags: new Set(),
      types: new Set(),
      versions: new Set(),
      channels: new Set(),
    };
    let sortField = 'uploadDate';
    let sortAsc = false;
    let expandedId = null;
    const PAGE_SIZE = 50;
    let visibleCount = PAGE_SIZE;
    let songMap = {};
    let unmatchedVideoCount = 0;

    const TAG_CONFIG = {
      light_music_club: { label: 'Leo/need', color: '#4dabf7' },
      idol: { label: 'MORE MORE JUMP!', color: '#69db7c' },
      street: { label: 'Vivid BAD SQUAD', color: '#f06595' },
      theme_park: { label: 'WxS', color: '#ffd43b' },
      school_refusal: { label: 'N25', color: '#9b6dff' },
      vocaloid: { label: 'V.S.', color: '#38d9e8' },
      other: { label: 'Other', color: '#868e96' },
    };

    const VIDEO_TYPE_CONFIG = {
      official_2dmv: { label: '官方 2DMV', color: 'var(--accent-blue)' },
      original_mv: { label: '本家 MV', color: 'var(--accent-orange)' },
    };

    const VIDEO_VERSION_CONFIG = {
      'base:original': { label: '本家' },
      'base:sekai': { label: 'SEKAI ver' },
      'base:virtual_singer': { label: 'Virtual Singer ver' },
      'base:another_vocal': { label: 'Another Vocal' },
      'base:unknown': { label: '未分类' },
      'special:april_fool': { label: '愚人节版' },
    };

    function formatDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatNumber(num) {
      if (num == null || isNaN(num)) return '-';
      if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      return num.toLocaleString('zh-CN');
    }

    function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function getDisplayTags(tags) { return (tags || []).filter(t => t !== 'all'); }

    function getVersionLabel(version) {
      if (!version) return '';
      if (version.label) return version.label;
      const baseKey = `base:${version.base}`;
      if (VIDEO_VERSION_CONFIG[baseKey]) return VIDEO_VERSION_CONFIG[baseKey].label;
      const specialKey = `special:${(version.special || [])[0]}`;
      if (VIDEO_VERSION_CONFIG[specialKey]) return VIDEO_VERSION_CONFIG[specialKey].label;
      return version.base || '';
    }

    function getVersionKeys(version) {
      if (!version) return [];
      const keys = [];
      if (version.base) keys.push(`base:${version.base}`);
      if (version.special && version.special.length) {
        version.special.forEach(s => keys.push(`special:${s}`));
      }
      return keys;
    }

    function buildVideoDetailHtml(v) {
      const sections = [];

      // Basic info
      const infoRows = [];
      infoRows.push(`<div class="detail-item"><span class="label">所属歌曲</span> <span class="value">${esc(v.songTitle || '-')}</span></div>`);
      infoRows.push(`<div class="detail-item"><span class="label">视频类型</span> <span class="value">${esc(VIDEO_TYPE_CONFIG[v.type]?.label || v.type)}</span></div>`);
      const verLabel = getVersionLabel(v.version);
      if (verLabel) infoRows.push(`<div class="detail-item"><span class="label">版本</span> <span class="value">${esc(verLabel)}</span></div>`);
      infoRows.push(`<div class="detail-item"><span class="label">频道</span> <span class="value">${esc(v.channelTitle || '-')}</span></div>`);
      infoRows.push(`<div class="detail-item"><span class="label">上传时间</span> <span class="value">${esc((v.uploadDate || '').slice(0, 10))}</span></div>`);
      if (infoRows.length) {
        sections.push(`<div class="detail-section"><div class="detail-label">基本信息</div><div class="detail-grid">${infoRows.join('')}</div></div>`);
      }

      // Stats
      const statRows = [];
      statRows.push(`<div class="detail-item"><span class="label">播放量</span> <span class="value">${formatNumber(v.viewCount)}</span></div>`);
      statRows.push(`<div class="detail-item"><span class="label">点赞</span> <span class="value">${formatNumber(v.likeCount)}</span></div>`);
      if (v.playlistPosition != null) statRows.push(`<div class="detail-item"><span class="label">播放列表位置</span> <span class="value">#${v.playlistPosition + 1}</span></div>`);
      if (statRows.length) {
        sections.push(`<div class="detail-section"><div class="detail-label">数据</div><div class="detail-grid">${statRows.join('')}</div></div>`);
      }

      // Link
      sections.push(`<div class="detail-section"><div class="detail-label">链接</div><div class="detail-item"><a class="detail-link" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${esc(v.url)}</a></div></div>`);

      // Staff
      const staff = v.staff || {};
      const allContributors = staff.allContributors || [];
      const staffItems = [];
      if (staff.illustrators && staff.illustrators.length) {
        staffItems.push(`<div class="detail-item"><span class="label">插画</span> <span class="value">${esc(staff.illustrators.join(' / '))}</span></div>`);
      }
      if (staff.pvCreators && staff.pvCreators.length) {
        staffItems.push(`<div class="detail-item"><span class="label">PV / 视频</span> <span class="value">${esc(staff.pvCreators.join(' / '))}</span></div>`);
      }
      if (staff.otherRoles) {
        Object.entries(staff.otherRoles).forEach(([role, names]) => {
          if (names && names.length) {
            staffItems.push(`<div class="detail-item"><span class="label">${esc(role)}</span> <span class="value">${esc(names.join(' / '))}</span></div>`);
          }
        });
      }
      if (staffItems.length) {
        sections.push(`<div class="detail-section"><div class="detail-label">Staff</div><div class="detail-grid">${staffItems.join('')}</div></div>`);
      }

      // All contributors detail
      if (allContributors.length) {
        const contributorTags = allContributors.map(c =>
          `<span class="staff-tag">${esc(c.roleRaw || c.role || '')}: ${esc(c.name || '')}</span>`
        ).join('');
        sections.push(`<div class="detail-section"><div class="detail-label">全部贡献者 (${allContributors.length})</div><div class="db-video-staff">${contributorTags}</div></div>`);
      }

      // Song context
      const song = songMap[v.songTitle];
      if (song) {
        const ctxRows = [];
        const tags = getDisplayTags(song.tags);
        if (tags.length) {
          ctxRows.push(`<div class="detail-item"><span class="label">标签</span> <span class="value"><div class="song-tags">${tags.map(t => `<span class="tag tag-${TAG_CONFIG[t] ? t : 'other'}">${TAG_CONFIG[t]?.label || t}</span>`).join('')}</div></span></div>`);
        }
        if (song.categories && song.categories.length) {
          ctxRows.push(`<div class="detail-item"><span class="label">MV 类型</span> <span class="value">${esc(song.categories.join(' / '))}</span></div>`);
        }
        if (song.creators) {
          const c = song.creators;
          if (c.creatorArtistName) ctxRows.push(`<div class="detail-item"><span class="label">艺术家</span> <span class="value">${esc(c.creatorArtistName)}</span></div>`);
          if (c.composer) ctxRows.push(`<div class="detail-item"><span class="label">作曲</span> <span class="value">${esc(c.composer)}</span></div>`);
        }
        if (ctxRows.length) {
          sections.push(`<div class="detail-section"><div class="detail-label">歌曲信息</div><div class="detail-grid">${ctxRows.join('')}</div></div>`);
        }
      }

      return `<div class="video-detail show" id="detail-${v._uid}">${sections.filter(Boolean).join('')}</div>`;
    }

    function buildVideoRowHtml(v) {
      const typeConfig = VIDEO_TYPE_CONFIG[v.type] || {};
      const typeLabel = typeConfig.label || v.type || '?';
      const typeClass = v.type === 'original_mv' ? 'vt-original' : 'vt-official';
      const verLabel = getVersionLabel(v.version);

      return `<div class="video-row" data-uid="${v._uid}" role="button" tabindex="0" aria-expanded="false" aria-label="展开视频 ${esc(v.title)} 的详情">
        <span class="video-type-col"><span class="video-type-badge ${typeClass}">${typeLabel}</span></span>
        <div class="video-title-col">
          <div class="video-title">${esc(v.title)}</div>
          <div class="video-song-name">${esc(v.songTitle || '-')}${v.isUnmatched ? ' · <span class="filter-chip">待关联</span>' : ''}</div>
        </div>
        <span class="video-version-col">${esc(verLabel || '-')}</span>
        <span class="video-channel-col" title="${esc(v.channelTitle || '')}">${esc(v.channelTitle || '-')}</span>
        <span class="video-views-col">${formatNumber(v.viewCount)}</span>
        <span class="video-date-col">${formatDate(v.uploadDate)}</span>
        <span class="expand-arrow">▶</span>
      </div>`;
    }

    function renderVideoList() {
      const container = document.getElementById('video-list');
      if (!filteredVideos.length) {
        container.innerHTML = '<div class="loading">没有找到匹配的视频</div>';
        updateLoadMore();
        return;
      }

      const pageItems = filteredVideos.slice(0, visibleCount);
      container.innerHTML = pageItems.map(buildVideoRowHtml).join('');
      updateLoadMore();
      bindListClick(container);
    }

    function loadMore() {
      const container = document.getElementById('video-list');
      const from = visibleCount;
      visibleCount = Math.min(visibleCount + PAGE_SIZE, filteredVideos.length);
      const newItems = filteredVideos.slice(from, visibleCount);
      container.insertAdjacentHTML('beforeend', newItems.map(buildVideoRowHtml).join(''));
      updateLoadMore();
    }

    function updateLoadMore() {
      const bar = document.getElementById('load-more-bar');
      const btn = document.getElementById('load-more-btn');
      if (visibleCount < filteredVideos.length) {
        bar.style.display = '';
        btn.textContent = `加载更多 (${visibleCount}/${filteredVideos.length})`;
      } else {
        bar.style.display = 'none';
      }
    }

    function toggleVideoRow(row, container) {
        const uid = row.dataset.uid;

        if (expandedId === uid) {
          expandedId = null;
          row.classList.remove('expanded');
          row.setAttribute('aria-expanded', 'false');
          const detail = document.getElementById(`detail-${uid}`);
          if (detail) detail.remove();
        } else {
          if (expandedId !== null) {
            const prevRow = container.querySelector(`.video-row[data-uid="${expandedId}"]`);
            if (prevRow) {
              prevRow.classList.remove('expanded');
              prevRow.setAttribute('aria-expanded', 'false');
            }
            const prevDetail = document.getElementById(`detail-${expandedId}`);
            if (prevDetail) prevDetail.remove();
          }
          expandedId = uid;
          row.classList.add('expanded');
          row.setAttribute('aria-expanded', 'true');
          const v = allVideos.find(x => x._uid === uid);
          if (v) row.insertAdjacentHTML('afterend', buildVideoDetailHtml(v));
        }
    }

    function bindListClick(container) {
      container.onclick = (e) => {
        const row = e.target.closest('.video-row');
        if (row) toggleVideoRow(row, container);
      };
      container.onkeydown = (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const row = e.target.closest('.video-row');
        if (!row) return;
        e.preventDefault();
        toggleVideoRow(row, container);
      };
    }

    function clearAllFilters() {
      Object.values(activeFilters).forEach(set => set.clear());
      renderFilters();
      applyFilters();
    }

    function updateFilterSummary(q) {
      const summary = document.getElementById('filter-summary');
      const labels = [];
      if (q) labels.push(`搜索：${q}`);
      Object.entries(activeFilters).forEach(([group, values]) => {
        values.forEach(value => {
          const label = TAG_CONFIG[value]?.label || VIDEO_TYPE_CONFIG[value]?.label || VIDEO_VERSION_CONFIG[value]?.label || value;
          labels.push(label);
        });
      });
      summary.innerHTML = labels.length
        ? `<strong>当前条件</strong>${labels.map(label => `<span class="filter-chip">${esc(label)}</span>`).join('')}`
        : '';
      summary.classList.toggle('visible', labels.length > 0);
      document.getElementById('clear-search-btn').disabled = !q;
    }

    function renderFilters() {
      const tagCounts = {}, typeCounts = {}, versionCounts = {}, channelCounts = {};
      allVideos.forEach(v => {
        getDisplayTags(v.songTags).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1);
        typeCounts[v.type] = (typeCounts[v.type] || 0) + 1;
        getVersionKeys(v.version).forEach(key => {
          if (VIDEO_VERSION_CONFIG[key]) versionCounts[key] = (versionCounts[key] || 0) + 1;
        });
        if (v.channelTitle) channelCounts[v.channelTitle] = (channelCounts[v.channelTitle] || 0) + 1;
      });

      const mkFilter = (container, items, counts, labels, type, colorMap) => {
        document.getElementById(container).innerHTML = items.filter(k => counts[k]).map(k => {
          const label = labels[k]?.label || labels[k] || k;
          const color = colorMap?.[k];
          const dot = color ? `<span class="filter-dot" style="background:${color}"></span>` : '';
          const set = activeFilters[type];
          const checked = set?.has(k);
          return `<label class="filter-item${checked ? ' active' : ''}" data-filter="${type}" data-value="${k}">
            <input type="checkbox"${checked ? ' checked' : ''}>${dot}${label}<span class="filter-count">${counts[k]}</span></label>`;
        }).join('');
      };

      mkFilter('tag-filters',
        ['light_music_club', 'idol', 'street', 'theme_park', 'school_refusal', 'vocaloid', 'other'],
        tagCounts, TAG_CONFIG, 'tags', Object.fromEntries(Object.entries(TAG_CONFIG).map(([k, v]) => [k, v.color])));

      mkFilter('type-filters', ['official_2dmv', 'original_mv'], typeCounts, VIDEO_TYPE_CONFIG, 'types', null);

      mkFilter('version-filters',
        ['base:original', 'base:sekai', 'base:virtual_singer', 'base:another_vocal', 'base:unknown', 'special:april_fool'],
        versionCounts, VIDEO_VERSION_CONFIG, 'versions', null);

      // Channels - only show top 20
      const topChannels = Object.entries(channelCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 20)
        .map(([name]) => name);
      mkFilter('channel-filters', topChannels, channelCounts,
        Object.fromEntries(topChannels.map(n => [n, { label: n }])), 'channels', null);

      document.querySelectorAll('[data-filter]').forEach(el => {
        el.addEventListener('change', () => {
          const { filter: type, value } = el.dataset;
          const set = activeFilters[type];
          if (!set) return;
          const checked = el.querySelector('input').checked;
          checked ? set.add(value) : set.delete(value);
          el.classList.toggle('active', checked);
          applyFilters();
        });
      });
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      updateFilterSummary(q);
      filteredVideos = allVideos.filter(v => {
        if (q) {
          const staff = v.staff || {};
          const allContributors = staff.allContributors || staff.contributors || [];
          const staffNames = [
            ...(staff.illustrators || []),
            ...(staff.pvCreators || []),
            ...allContributors.map(c => c.name || ''),
            ...allContributors.map(c => c.roleRaw || ''),
          ];
          const fields = [
            v.title,
            v.songTitle,
            v.channelTitle,
            v.description || '',
            getVersionLabel(v.version),
            ...staffNames,
          ].map(f => (f || '').toLowerCase());
          if (!fields.some(f => f.includes(q))) return false;
        }
        if (activeFilters.tags.size && !getDisplayTags(v.songTags).some(t => activeFilters.tags.has(t))) return false;
        if (activeFilters.types.size && !activeFilters.types.has(v.type)) return false;
        if (activeFilters.versions.size) {
          const vKeys = new Set(getVersionKeys(v.version));
          if (![...activeFilters.versions].every(key => vKeys.has(key))) return false;
        }
        if (activeFilters.channels.size && !activeFilters.channels.has(v.channelTitle)) return false;
        return true;
      });

      filteredVideos.sort((a, b) => {
        let va = a[sortField], vb = b[sortField];
        if (sortField === 'title') { va = (va || '').toLowerCase(); vb = (vb || '').toLowerCase(); }
        if (sortField === 'version') { va = getVersionLabel(a.version); vb = getVersionLabel(b.version); }
        if (sortField === 'type') { va = a.type || ''; vb = b.type || ''; }
        if (va == null) va = '';
        if (vb == null) vb = '';
        if (typeof va === 'string') va = va.toLowerCase();
        if (typeof vb === 'string') vb = vb.toLowerCase();
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });

      document.getElementById('stat-filtered').textContent = filteredVideos.length;
      document.getElementById('results-info').textContent =
        `显示 ${filteredVideos.length} / ${allVideos.length} 个视频 · 待关联 ${unmatchedVideoCount}`;
      expandedId = null;
      visibleCount = PAGE_SIZE;
      renderVideoList();
    }

    function updateBackToTopButton() {
      const btn = document.getElementById('back-to-top-btn');
      if (!btn) return;
      btn.classList.toggle('visible', window.scrollY > 320);
    }

    function bindBackToTopButton() {
      const btn = document.getElementById('back-to-top-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      window.addEventListener('scroll', updateBackToTopButton, { passive: true });
      updateBackToTopButton();
    }

    function handleFileProtocolAccess() {
      if (location.protocol !== 'file:') return false;
      const targetUrl = 'http://localhost:8000/video_viewer.html';
      document.getElementById('video-list').innerHTML =
        `<div class="loading">
          检测到你是直接打开本地 HTML 文件。<br>
          浏览器会拦截对 JSON 的读取。<br><br>
          请通过本地服务器访问：<a class="detail-link" href="${targetUrl}">${targetUrl}</a><br>
          如果服务器已启动，页面将自动跳转；否则请先运行 <strong>start_server.bat</strong>。
        </div>`;
      setTimeout(() => { window.location.href = targetUrl; }, 1200);
      return true;
    }

    function normalizeSongTitle(value) {
      return String(value || '')
        .normalize('NFKC')
        .toLocaleLowerCase('ja')
        .replace(/[\s・･·:：!！?？'"“”‘’()（）\[\]【】「」『』\-‐‑‒–—―_/／\\]/g, '');
    }

    function buildFallbackSongContext(dbSong) {
      const unitTags = {
        'Leo/need': 'light_music_club',
        'MORE MORE JUMP!': 'idol',
        'Vivid BAD SQUAD': 'street',
        'ワンダショ': 'theme_park',
        'Wonderlands×Showtime': 'theme_park',
        '25時、ナイトコードで。': 'school_refusal',
        'Virtual Singer': 'vocaloid',
      };
      const tags = (dbSong.classification?.units || []).map(unit => unitTags[unit]).filter(Boolean);
      return {
        id: dbSong.sekaiMusicId || dbSong.id,
        title: dbSong.title,
        tags: tags.length ? tags : ['other'],
        categories: dbSong.classification?.mvType ? [dbSong.classification.mvType] : [],
        creators: dbSong.creators || null,
      };
    }

    async function init() {
      if (handleFileProtocolAccess()) return;

      try {
        const [baseResp, dbResp] = await Promise.all([
          fetch('output/combined_music_data.json', { cache: 'no-store' }),
          fetch('output/database_v2.json', { cache: 'no-store' }).catch(() => null),
        ]);
        const baseSongs = await baseResp.json();
        let databaseV2 = null;
        if (dbResp && dbResp.ok) databaseV2 = await dbResp.json();
        if (!databaseV2) throw new Error('database_v2.json 不可用，无法保证视频列表完整性');

        const baseById = new Map(baseSongs.map(song => [Number(song.id), song]));
        const baseByTitle = new Map();
        baseSongs.forEach(song => {
          const key = normalizeSongTitle(song.title);
          if (key && !baseByTitle.has(key)) baseByTitle.set(key, song);
          songMap[song.title] = song;
        });

        // database_v2 is the video source of truth. Base data only enriches rows.
        let uidCounter = 0;
        allVideos = [];
        unmatchedVideoCount = 0;

        (databaseV2?.songs || []).forEach(dbSong => {
          const matchedSong = baseById.get(Number(dbSong.sekaiMusicId)) || baseByTitle.get(normalizeSongTitle(dbSong.title));
          const song = matchedSong || buildFallbackSongContext(dbSong);
          songMap[dbSong.title] = song;
          (dbSong.videos || []).forEach(video => {
            if (!matchedSong) unmatchedVideoCount += 1;
            allVideos.push({
              ...video,
              _uid: String(uidCounter++),
              songId: song.id,
              songTitle: dbSong.title,
              songTags: song.tags || [],
              songCategories: song.categories || [],
              songCreators: song.creators || null,
              isUnmatched: !matchedSong,
            });
          });
        });

        document.getElementById('stat-total').textContent = allVideos.length;
        document.getElementById('stat-unmatched').textContent = unmatchedVideoCount;
        filteredVideos = [...allVideos];
        renderFilters();
        applyFilters();
      } catch (e) {
        document.getElementById('video-list').innerHTML =
          `<div class="loading">加载失败：${e.message}<br>请确保 output 目录中的 JSON 文件存在，并通过 HTTP 服务器访问当前页面。</div>`;
        return;
      }

      document.getElementById('load-more-btn').addEventListener('click', loadMore);

      let timer;
      document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(applyFilters, 200);
      });
      document.getElementById('clear-search-btn').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        applyFilters();
        document.getElementById('search-input').focus();
      });
      document.getElementById('clear-filters-btn').addEventListener('click', clearAllFilters);

      document.querySelectorAll('.sort-button[data-sort]').forEach(el => {
        el.addEventListener('click', () => {
          const f = el.dataset.sort;
          if (sortField === f) sortAsc = !sortAsc;
          else { sortField = f; sortAsc = (f === 'viewCount'); }
          document.querySelectorAll('.sort-indicator').forEach(si => si.textContent = '');
          const ind = document.getElementById(`sort-${f}`);
          if (ind) ind.textContent = sortAsc ? '▲' : '▼';
          document.querySelectorAll('.list-header [role="columnheader"]').forEach(header => header.removeAttribute('aria-sort'));
          el.closest('[role="columnheader"]')?.setAttribute('aria-sort', sortAsc ? 'ascending' : 'descending');
          applyFilters();
        });
      });

      bindBackToTopButton();
    }

    init();
  </script>
</body>

</html>
