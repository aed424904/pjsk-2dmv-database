<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频列表 - Project Sekai 2DMV Database</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231668dc'/%3E%3Cpath d='M18 40V22h27v18H18zm6-5h15v-8H24v8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/video_viewer.css">
  <link rel="stylesheet" href="assets/viewer_controls.css">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-kicker">Video Explorer</div>
        <h1>Project Sekai 2DMV Database</h1>
        <div class="header-subtitle">按视频逐个浏览，查看每条 MV 的详细信息与 Staff 阵容</div>
      </div>
      <div class="header-nav">
        <a class="nav-link" href="index.html">🎵 歌曲列表</a>
        <a class="nav-link active" href="video_viewer.html">📺 视频列表</a>
        <a class="nav-link" href="editor.html">🛠️ 编辑工具</a>
      </div>
      <div class="stats-bar">
        <div class="stat">视频 <span class="stat-num" id="stat-total">-</span></div>
        <div class="stat">已筛选 <span class="stat-num" id="stat-filtered">-</span></div>
        <div class="stat">待关联 <span class="stat-num" id="stat-unmatched">-</span></div>
      </div>
    </div>
  </header>

  <div class="app">
    <button class="filter-drawer-backdrop" id="filter-drawer-backdrop" type="button" tabindex="-1"
      aria-hidden="true" aria-label="关闭筛选条件"></button>
    <aside class="sidebar" id="sidebar" aria-label="筛选条件">
      <div class="sidebar-mobile-header">
        <div>
          <div class="sidebar-mobile-kicker">Refine Results</div>
          <h2 class="sidebar-mobile-title">筛选条件</h2>
        </div>
        <button class="sidebar-mobile-close" id="filter-drawer-close" type="button" aria-label="关闭筛选条件">×</button>
      </div>
      <button class="sidebar-clear" id="clear-filters-btn" type="button">清空筛选</button>
      <h3>团队 / 标签</h3>
      <div class="filter-group" id="tag-filters"></div>
      <h3>视频类型</h3>
      <div class="filter-group" id="type-filters"></div>
      <h3>视频版本</h3>
      <div class="filter-group" id="version-filters"></div>
      <h3>频道</h3>
      <div class="filter-group" id="channel-filters"></div>
      <button class="sidebar-done" id="filter-drawer-done" type="button">
        查看 <span class="sidebar-done-count" id="filter-drawer-result-count">-</span> 个结果
      </button>
    </aside>

    <main class="main">
      <div class="search-bar">
        <label class="search-label" for="search-input">搜索视频</label>
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索视频标题、歌曲名、Staff、频道..." autocomplete="off">
        <button class="clear-button" id="clear-search-btn" type="button" disabled>清空</button>
      </div>
      <div class="mobile-filter-toolbar">
        <button class="mobile-filter-trigger" id="filter-drawer-trigger" type="button" aria-controls="sidebar"
          aria-expanded="false">筛选条件 <span class="mobile-filter-count" id="active-filter-count" hidden>0</span></button>
        <span class="mobile-filter-hint">可按团队、类型、版本与频道筛选</span>
      </div>
      <div class="filter-summary" id="filter-summary" aria-live="polite"></div>
      <div class="results-info" id="results-info"></div>
      <section class="table-shell">
        <div class="list-header">
          <span role="columnheader"><button class="sort-button" data-sort="type">类型 <span class="sort-indicator" id="sort-type"></span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="title">视频标题 <span class="sort-indicator" id="sort-title"></span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="version">版本 <span class="sort-indicator" id="sort-version"></span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="channelTitle">频道 <span class="sort-indicator" id="sort-channelTitle"></span></button></span>
          <span role="columnheader" style="text-align:right"><button class="sort-button" data-sort="viewCount">播放量 <span class="sort-indicator" id="sort-viewCount"></span></button></span>
          <span role="columnheader" aria-sort="descending" style="text-align:right"><button class="sort-button" data-sort="uploadDate">上传时间 <span class="sort-indicator" id="sort-uploadDate">▼</span></button></span>
          <span></span>
        </div>
        <div id="video-list" class="video-list">
          <div class="loading">
            <div class="spinner"></div>
            <div>加载数据中...</div>
          </div>
        </div>
        <div id="load-more-bar" class="load-more-bar" style="display:none">
          <button class="load-more-btn" id="load-more-btn">加载更多</button>
        </div>
      </section>
    </main>
  </div>

  <button class="back-to-top" id="back-to-top-btn" type="button" aria-label="回到顶部">
    <span class="back-to-top-icon">↑</span>
    <span>回到顶部</span>
  </button>

  <script src="assets/viewer_controls.js"></script>
  <script src="assets/video_viewer.js"></script>
</body>

</html>
