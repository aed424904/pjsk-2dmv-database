<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Sekai 2DMV Database</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231668dc'/%3E%3Cpath d='M18 40V22h27v18H18zm6-5h15v-8H24v8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/index.css">
  <link rel="stylesheet" href="assets/viewer_controls.css">
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-kicker">Operations Dashboard</div>
        <h1>Project Sekai 2DMV Database</h1>
        <div class="header-subtitle">浏览歌曲、Staff 信息与版本详情</div>
        <div class="header-notice">
          <span>⚠️ 数据整理中，可能有错漏，仅供参考</span>
          <span class="header-notice-date" id="notice-date">最后更新：-</span>
        </div>
      </div>
      <div class="header-nav">
        <a class="nav-link active" href="index.html">🎵 歌曲列表</a>
        <a class="nav-link" href="video_viewer.html">📺 视频列表</a>
        <a class="nav-link" href="editor.html">🛠️ 编辑工具</a>
      </div>
      <div class="stats-bar">
        <div class="stat">歌曲 <span class="stat-num" id="stat-total">-</span></div>
        <div class="stat">已筛选 <span class="stat-num" id="stat-filtered">-</span></div>
      </div>
    </div>
  </header>

  <div class="app">
    <button class="filter-drawer-backdrop" id="filter-drawer-backdrop" type="button" tabindex="-1"
      aria-hidden="true" aria-label="关闭筛选条件"></button>
    <aside class="sidebar" id="sidebar" aria-label="筛选条件">
      <div class="sidebar-mobile-header">
        <div>
          <div class="sidebar-mobile-kicker">Refine Results</div>
          <h2 class="sidebar-mobile-title">筛选条件</h2>
        </div>
        <button class="sidebar-mobile-close" id="filter-drawer-close" type="button" aria-label="关闭筛选条件">×</button>
      </div>
      <button class="sidebar-clear" id="clear-filters-btn" type="button">清空筛选</button>
      <h3>团队 / 标签</h3>
      <div class="filter-group" id="tag-filters"></div>
      <h3>MV 类型</h3>
      <div class="filter-group" id="cat-filters"></div>
      <h3>歌声版本</h3>
      <div class="filter-group" id="vocal-filters"></div>
      <h3>视频版本</h3>
      <div class="filter-group" id="version-filters"></div>
      <h3>Staff 字段</h3>
      <div class="filter-group" id="staff-filters"></div>
      <button class="sidebar-done" id="filter-drawer-done" type="button">
        查看 <span class="sidebar-done-count" id="filter-drawer-result-count">-</span> 个结果
      </button>
    </aside>

    <main class="main">
      <div class="search-bar">
        <label class="search-label" for="search-input">搜索歌曲</label>
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索歌名、创作者、别称、Staff、版本..." autocomplete="off">
        <button class="clear-button" id="clear-search-btn" type="button" disabled>清空</button>
      </div>
      <div class="mobile-filter-toolbar">
        <button class="mobile-filter-trigger" id="filter-drawer-trigger" type="button" aria-controls="sidebar"
          aria-expanded="false">筛选条件 <span class="mobile-filter-count" id="active-filter-count" hidden>0</span></button>
        <span class="mobile-filter-hint">可按团队、版本与 Staff 缩小范围</span>
      </div>
      <div class="filter-summary" id="filter-summary" aria-live="polite"></div>
      <section class="staff-stats-panel" id="staff-stats-panel">
        <div class="staff-stats-header">
          <div class="staff-stats-title">Staff 统计</div>
          <div class="staff-stats-subtitle" id="staff-stats-subtitle">基于当前结果统计</div>
        </div>
        <div class="staff-stats-grid" id="staff-stats-grid"></div>
      </section>
      <div class="results-info" id="results-info"></div>
      <section class="table-shell">
        <div class="list-header">
          <span role="columnheader" aria-sort="ascending"><button class="sort-button" data-sort="id">ID <span class="sort-indicator" id="sort-id">▲</span></button></span>
          <span role="columnheader"><button class="sort-button" data-sort="title">歌名 <span class="sort-indicator" id="sort-title"></span></button></span>
          <span>标签</span>
          <span>MV类型</span>
          <span role="columnheader" style="text-align:right"><button class="sort-button" data-sort="publishedAt">实装时间 <span class="sort-indicator"
              id="sort-publishedAt"></span></button></span>
          <span></span>
        </div>
        <div id="song-list" class="song-list">
          <div class="loading">
            <div class="spinner"></div>
            <div>加载数据中...</div>
          </div>
        </div>
        <div id="load-more-bar" class="load-more-bar" style="display:none">
          <button class="load-more-btn" id="load-more-btn">加载更多</button>
        </div>
      </section>
    </main>
  </div>

  <button class="back-to-top" id="back-to-top-btn" type="button" aria-label="回到顶部">
    <span class="back-to-top-icon">↑</span>
    <span>回到顶部</span>
  </button>

  <script src="assets/viewer_controls.js"></script>
  <script src="assets/index.js"></script>
</body>

</html>
