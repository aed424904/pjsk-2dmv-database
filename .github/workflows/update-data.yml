name: 定时更新数据并部署

on:
  schedule:
    # 每天 UTC 0:00 跑一次（北京时间早上 8 点）
    - cron: '0 0 * * *'
  # 也允许手动触发
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # 用于推送更新后的数据文件
      pages: write     # 用于部署
      id-token: write

    steps:
      - name: 检出仓库（含子模块）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests yt-dlp

      - name: 克隆游戏数据仓库
        run: |
          if [ -d sekai-master-db-diff-main/.git ]; then
            echo "游戏数据仓库已存在，拉取更新..."
            cd sekai-master-db-diff-main && git pull --ff-only
          else
            echo "首次克隆游戏数据仓库..."
            git clone --depth 1 https://github.com/Sekai-World/sekai-master-db-diff.git sekai-master-db-diff-main
          fi

      - name: 刷新 YouTube 播放列表
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/auto_update.py

      - name: 补全播放量和频道信息
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/enrich_playlist_channels.py

      - name: 提交更新的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只添加数据文件
          git add fetch_youtube_playlist/*.json
          git add output/*.json
          git add sekai-master-db-diff-main/ || true

          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新数据 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # 排除不需要部署的目录
          exclude_assets: '.github,scripts,tests,backup,__pycache__,**/__pycache__,**/*.py,*.md,requirements.txt'
