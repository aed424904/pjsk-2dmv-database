name: 定时更新数据并部署

on:
  schedule:
    # 每天 UTC 0:00 跑一次（北京时间早上 8 点）
    - cron: '0 0 * * *'
  # 也允许手动触发
  workflow_dispatch:

concurrency:
  group: project-sekai-data-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # 用于推送更新后的数据文件
      pages: write     # 用于部署
      id-token: write

    steps:
      - name: 检出仓库（含子模块）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests yt-dlp

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 刷新 YouTube 播放列表
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REQUIRE_SOURCE_REFRESH_SUCCESS: '1'
        run: |
          python scripts/auto_update.py

      - name: 验证最终数据库
        run: python scripts/validate_data.py

      - name: 构建部署目录
        run: python scripts/build_site.py

      - name: 提交更新的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只添加数据文件
          git add fetch_youtube_playlist/*.json
          git add output/*.json
          git add sekai-master-db-diff-main/ || true

          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新数据 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
