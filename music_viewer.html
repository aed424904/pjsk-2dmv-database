<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Sekai 2DMV Database</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+SC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f5f7fb;
      --bg-secondary: #eef3f8;
      --bg-card: #ffffff;
      --bg-hover: #f7faff;
      --bg-input: #fbfcfe;
      --border: #d8e1eb;
      --border-strong: #bcc8d6;
      --line-soft: #e9eef5;
      --text-primary: #1f2d3d;
      --text-secondary: #546476;
      --text-muted: #8391a2;
      --accent-blue: #1668dc;
      --accent-purple: #7457d8;
      --accent-pink: #cc5b87;
      --accent-cyan: #0f766e;
      --accent-green: #2f8f5b;
      --accent-orange: #c67a1c;
      --accent-red: #cf4d52;
      --tag-leo: #1769cc;
      --tag-mmj: #2e9c5d;
      --tag-vbs: #be4d7d;
      --tag-wxs: #be9323;
      --tag-n25: #6d52c7;
      --tag-vocaloid: #177f9a;
      --tag-other: #7b8795;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(31, 45, 61, 0.05);
      --shadow-soft: 0 2px 8px rgba(31, 45, 61, 0.04);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans SC', 'Noto Sans JP', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      background-image: linear-gradient(180deg, #ffffff 0, #f5f7fb 160px);
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(216, 225, 235, 0.9);
      box-shadow: 0 6px 20px rgba(31, 45, 61, 0.04);
      padding: 18px 24px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .header-kicker {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid rgba(22, 104, 220, 0.12);
      border-radius: 10px;
      background: rgba(22, 104, 220, 0.05);
      color: var(--accent-blue);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .header-subtitle {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    .header .stats-bar {
      display: flex;
      gap: 10px;
      margin-left: auto;
      color: var(--text-muted);
    }

    .stats-bar .stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-soft);
      font-size: 12px;
    }

    .stats-bar .stat-num {
      color: var(--accent-blue);
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
      font-size: 16px;
    }

    /* Layout */
    .app {
      max-width: 1540px;
      margin: 0 auto;
      display: flex;
      gap: 18px;
      min-height: calc(100vh - 88px);
      padding: 18px 24px 24px;
      align-items: flex-start;
    }

    /* Sidebar */
    .sidebar {
      width: 272px;
      min-width: 272px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      padding: 18px;
      position: sticky;
      top: 104px;
      height: calc(100vh - 128px);
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 10px;
      margin-top: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
    }

    .sidebar h3:first-child {
      margin-top: 0;
    }

    .filter-group {
      margin-bottom: 10px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.15s;
      user-select: none;
      border: 1px solid transparent;
      background: transparent;
    }

    .filter-item:hover {
      background: #f8fbff;
      color: var(--text-primary);
      border-color: #d7e7fb;
    }

    .filter-item.active {
      background: rgba(22, 104, 220, 0.06);
      color: var(--text-primary);
      border-color: rgba(22, 104, 220, 0.22);
      box-shadow: inset 2px 0 0 var(--accent-blue);
    }

    .filter-item input[type="checkbox"] {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-strong);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      background: #fff;
    }

    .filter-item input[type="checkbox"]:checked {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .filter-item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: -2px;
      left: 1px;
      font-size: 11px;
      color: white;
      font-weight: 700;
    }

    .filter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .filter-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Main content */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Search bar */
    .search-bar {
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 15px 16px 15px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-soft);
    }

    .search-bar input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(22, 104, 220, 0.08);
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    .search-bar .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Results info */
    .results-info {
      font-size: 12px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .staff-stats-panel {
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
    }

    .staff-stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .staff-stats-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.4px;
    }

    .staff-stats-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .staff-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .staff-stat-card {
      min-width: 0;
      padding: 12px;
      background: #fbfcfe;
      border: 1px solid #e4ebf2;
      border-radius: 14px;
    }

    .staff-stat-card.active-role {
      border-color: rgba(22, 104, 220, 0.28);
      box-shadow: inset 0 0 0 1px rgba(22, 104, 220, 0.06);
    }

    .staff-stat-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }

    .staff-stat-role {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .staff-stat-meta {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .staff-stat-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .staff-stat-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .staff-stat-rank {
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }

    .staff-stat-name {
      min-width: 0;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .staff-stat-count {
      color: var(--text-primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .staff-stat-empty {
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .table-shell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    /* Song list */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--bg-card);
      overflow: hidden;
    }

    .song-row {
      display: grid;
      grid-template-columns: 62px minmax(320px, 1.6fr) 220px 120px 128px 32px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-card);
      cursor: pointer;
      font-size: 13px;
      contain: content;
      border-bottom: 1px solid var(--line-soft);
    }

    .song-row:hover {
      background: var(--bg-hover);
    }

    .song-row.expanded {
      background: #f2f7ff;
    }

    .song-id {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      font-family: 'IBM Plex Mono', monospace;
    }

    .song-title-col {
      min-width: 0;
    }

    .song-title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-creator {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-staff-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .song-version-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .version-preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 11px;
      line-height: 1.3;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .version-preview-badge.base-original {
      background: rgba(198, 122, 28, 0.08);
      border-color: rgba(198, 122, 28, 0.18);
      color: var(--accent-orange);
    }

    .version-preview-badge.base-sekai {
      background: rgba(22, 104, 220, 0.08);
      border-color: rgba(22, 104, 220, 0.18);
      color: var(--accent-blue);
    }

    .version-preview-badge.base-virtual_singer {
      background: rgba(15, 118, 110, 0.08);
      border-color: rgba(15, 118, 110, 0.16);
      color: var(--accent-cyan);
    }

    .version-preview-badge.base-another_vocal {
      background: rgba(204, 91, 135, 0.08);
      border-color: rgba(204, 91, 135, 0.16);
      color: var(--accent-pink);
    }

    .version-preview-badge.base-unknown {
      background: rgba(123, 135, 149, 0.1);
      border-color: rgba(123, 135, 149, 0.18);
      color: var(--tag-other);
    }

    .version-preview-badge.special-april_fool {
      background: rgba(255, 212, 59, 0.18);
      border-color: rgba(198, 122, 28, 0.2);
      color: #9b6a00;
    }

    .staff-preview-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.08);
      border: 1px solid rgba(15, 118, 110, 0.16);
      font-size: 11px;
      line-height: 1.3;
      color: var(--text-secondary);
    }

    .staff-preview-label {
      color: var(--accent-cyan);
      font-weight: 600;
      white-space: nowrap;
    }

    .staff-preview-value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .song-tags {
      display: flex;
      gap: 4px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .tag-light_music_club {
      background: rgba(77, 171, 247, 0.15);
      color: var(--tag-leo);
    }

    .tag-idol {
      background: rgba(105, 219, 124, 0.15);
      color: var(--tag-mmj);
    }

    .tag-street {
      background: rgba(240, 101, 149, 0.15);
      color: var(--tag-vbs);
    }

    .tag-theme_park {
      background: rgba(255, 212, 59, 0.15);
      color: var(--tag-wxs);
    }

    .tag-school_refusal {
      background: rgba(155, 109, 255, 0.15);
      color: var(--tag-n25);
    }

    .tag-vocaloid {
      background: rgba(56, 217, 232, 0.12);
      color: var(--tag-vocaloid);
    }

    .tag-other {
      background: rgba(134, 142, 150, 0.15);
      color: var(--tag-other);
    }

    .song-categories {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cat-mv {
      background: rgba(91, 138, 245, 0.2);
      color: var(--accent-blue);
    }

    .cat-mv_2d {
      background: rgba(240, 101, 149, 0.2);
      color: var(--accent-pink);
    }

    .cat-image {
      background: rgba(81, 207, 125, 0.2);
      color: var(--accent-green);
    }

    .cat-original {
      background: rgba(155, 109, 255, 0.2);
      color: var(--accent-purple);
    }

    .song-date {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
    }

    .expand-arrow {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      transition: transform 0.2s;
    }

    .song-row.expanded .expand-arrow {
      transform: rotate(90deg);
    }

    /* Detail panel */
    .song-detail {
      display: none;
      background: #f8fafd;
      border-top: 1px solid var(--line-soft);
      padding: 14px 16px 18px;
    }

    .song-detail.show {
      display: block;
    }

    .detail-section {
      margin-bottom: 12px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-blue);
      margin-bottom: 6px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    .detail-item {
      font-size: 13px;
    }

    .detail-item .label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .detail-item .value {
      color: var(--text-primary);
    }

    .detail-link {
      color: var(--accent-cyan);
      text-decoration: none;
      word-break: break-all;
    }

    .detail-link:hover {
      text-decoration: underline;
    }

    .detail-badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Vocal list */
    .vocal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .vocal-item {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      padding: 6px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
    }

    .vocal-type-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .vt-original_song {
      background: rgba(56, 217, 232, 0.2);
      color: var(--accent-cyan);
    }

    .vt-sekai {
      background: rgba(91, 138, 245, 0.2);
      color: var(--accent-blue);
    }

    .vt-another_vocal {
      background: rgba(240, 101, 149, 0.2);
      color: var(--accent-pink);
    }

    .vt-virtual_singer {
      background: rgba(155, 109, 255, 0.2);
      color: var(--accent-purple);
    }

    .vt-instrumental {
      background: rgba(134, 142, 150, 0.2);
      color: var(--tag-other);
    }

    .vt-april_fool_2022 {
      background: rgba(255, 212, 59, 0.2);
      color: var(--accent-orange);
    }

    .vt-streaming_live {
      background: rgba(81, 207, 125, 0.2);
      color: var(--accent-green);
    }

    .vocal-caption {
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .vocal-chars {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
      min-width: 0;
      flex: 1 1 240px;
      white-space: normal;
    }

    /* Column header */
    .list-header {
      display: grid;
      grid-template-columns: 62px minmax(320px, 1.6fr) 220px 120px 128px 32px;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      background: #f7f9fc;
      border-bottom: 1px solid var(--line-soft);
      user-select: none;
    }

    .list-header span {
      cursor: pointer;
    }

    .list-header span:hover {
      color: var(--text-secondary);
    }

    .sort-indicator {
      font-size: 10px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
      background: var(--bg-card);
    }

    .loading .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    .load-more-bar {
      text-align: center;
      padding: 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--line-soft);
    }

    .load-more-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    .load-more-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .back-to-top {
      position: fixed;
      right: 24px;
      bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border: 1px solid rgba(22, 104, 220, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      font-family: 'IBM Plex Sans SC', 'Noto Sans JP', sans-serif;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 28px rgba(31, 45, 61, 0.12);
      cursor: pointer;
      z-index: 120;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .back-to-top:hover {
      border-color: rgba(22, 104, 220, 0.32);
      box-shadow: 0 14px 32px rgba(22, 104, 220, 0.16);
    }

    .back-to-top-icon {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      line-height: 1;
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .app {
        padding: 12px;
      }

      .header-inner {
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .header .stats-bar {
        margin-left: 0;
        width: 100%;
      }

      .song-row {
        grid-template-columns: 40px 1fr 80px 32px;
      }

      .list-header {
        grid-template-columns: 40px 1fr 80px 32px;
      }

      .song-tags,
      .song-date {
        display: none;
      }

      .back-to-top {
        right: 16px;
        bottom: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-kicker">Operations Dashboard</div>
        <h1>Project Sekai 2DMV Database</h1>
        <div class="header-subtitle">面向运营筛选、Staff 归档与曲目巡检的统一视图</div>
      </div>
      <div class="stats-bar">
        <div class="stat">歌曲 <span class="stat-num" id="stat-total">-</span></div>
        <div class="stat">已筛选 <span class="stat-num" id="stat-filtered">-</span></div>
      </div>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <h3>团队 / 标签</h3>
      <div class="filter-group" id="tag-filters"></div>
      <h3>MV 类型</h3>
      <div class="filter-group" id="cat-filters"></div>
      <h3>歌声版本</h3>
      <div class="filter-group" id="vocal-filters"></div>
      <h3>视频版本</h3>
      <div class="filter-group" id="version-filters"></div>
      <h3>Staff 字段</h3>
      <div class="filter-group" id="staff-filters"></div>
    </aside>

    <main class="main">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索歌名、创作者、别称、Staff、版本..." autocomplete="off">
      </div>
      <section class="staff-stats-panel" id="staff-stats-panel">
        <div class="staff-stats-header">
          <div class="staff-stats-title">Staff 统计</div>
          <div class="staff-stats-subtitle" id="staff-stats-subtitle">基于当前结果统计</div>
        </div>
        <div class="staff-stats-grid" id="staff-stats-grid"></div>
      </section>
      <div class="results-info" id="results-info"></div>
      <section class="table-shell">
        <div class="list-header">
          <span data-sort="id">ID <span class="sort-indicator" id="sort-id">▲</span></span>
          <span data-sort="title">歌名 <span class="sort-indicator" id="sort-title"></span></span>
          <span>标签</span>
          <span>MV类型</span>
          <span data-sort="publishedAt" style="text-align:right">实装时间 <span class="sort-indicator"
              id="sort-publishedAt"></span></span>
          <span></span>
        </div>
        <div id="song-list" class="song-list">
          <div class="loading">
            <div class="spinner"></div>
            <div>加载数据中...</div>
          </div>
        </div>
        <div id="load-more-bar" class="load-more-bar" style="display:none">
          <button class="load-more-btn" id="load-more-btn">加载更多</button>
        </div>
      </section>
    </main>
  </div>

  <button class="back-to-top" id="back-to-top-btn" type="button" aria-label="回到顶部">
    <span class="back-to-top-icon">↑</span>
    <span>回到顶部</span>
  </button>

  <script>
    let allSongs = [];
    let filteredSongs = [];
    let activeFilters = {
      tags: new Set(),
      categories: new Set(),
      vocalTypes: new Set(),
      videoVersions: new Set(),
      staffRoles: new Set(),
    };
    let sortField = 'id';
    let sortAsc = true;
    let expandedId = null;
    const PAGE_SIZE = 50;
    let visibleCount = PAGE_SIZE;
    let aliasMap = {};
    let characterNameMap = { game_character: new Map(), outside_character: new Map() };

    const TAG_CONFIG = {
      light_music_club: { label: 'Leo/need', color: '#4dabf7' },
      idol: { label: 'MORE MORE JUMP!', color: '#69db7c' },
      street: { label: 'Vivid BAD SQUAD', color: '#f06595' },
      theme_park: { label: 'WxS', color: '#ffd43b' },
      school_refusal: { label: 'N25', color: '#9b6dff' },
      vocaloid: { label: 'V.S.', color: '#38d9e8' },
      other: { label: 'Other', color: '#868e96' },
    };
    const CAT_LABELS = { mv: '3D MV', mv_2d: '2D MV', image: 'Image', original: 'Original' };
    const VOCAL_LABELS = {
      original_song: '原唱', sekai: 'セカイ', another_vocal: 'アナザー',
      virtual_singer: 'V家合唱', instrumental: 'Inst.',
      april_fool_2022: 'エイプリル', streaming_live: 'Connect Live',
    };
    const VIDEO_VERSION_CONFIG = {
      'base:original': { label: '本家' },
      'base:sekai': { label: 'SEKAI ver' },
      'base:virtual_singer': { label: 'Virtual Singer ver' },
      'base:another_vocal': { label: 'Another Vocal' },
      'base:unknown': { label: '未分类' },
      'special:april_fool': { label: '愚人节版' },
    };
    const VIDEO_VERSION_ORDER = Object.keys(VIDEO_VERSION_CONFIG);
    const STAFF_ROLE_CONFIG = {
      illustrator: { label: '插画师' },
      pvCreator: { label: 'PV / 视频' },
      illustrationAnimation: { label: '插图动画' },
      lyricDesign: { label: '歌词设计' },
      animation: { label: '动画' },
      design: { label: '设计 / Logo' },
      cg3d: { label: '3DCG' },
      unknown: { label: '待整理' },
    };
    const STAFF_ROLE_ORDER = Object.keys(STAFF_ROLE_CONFIG);

    function formatDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function getDisplayTags(tags) { return (tags || []).filter(t => t !== 'all'); }
    function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    function createEmptyStaffSummary() {
      return {
        illustrators: [],
        pvCreators: [],
        otherRoles: {
          illustrationAnimation: [],
          lyricDesign: [],
          animation: [],
          design: [],
          cg3d: [],
          unknown: [],
        },
        allContributors: [],
      };
    }
    function createEmptyVideoVersionSummary() {
      return {
        bases: [],
        special: [],
        labels: [],
      };
    }
    function buildGameCharacterName(character) {
      return [character?.firstName, character?.givenName].filter(Boolean).join('') ||
        character?.givenName ||
        character?.firstName ||
        character?.name ||
        '';
    }
    function buildCharacterNameLookup(gameCharacters = [], outsideCharacters = []) {
      const lookup = {
        game_character: new Map(),
        outside_character: new Map(),
      };

      gameCharacters.forEach(character => {
        const name = buildGameCharacterName(character);
        if (name) lookup.game_character.set(Number(character.id), name);
      });

      outsideCharacters.forEach(character => {
        const name = character?.name || '';
        if (name) lookup.outside_character.set(Number(character.id), name);
      });

      return lookup;
    }
    function getCharacterDisplayName(character) {
      const type = character?.characterType === 'outside_character' ? 'outside_character' : 'game_character';
      const id = Number(character?.characterId);
      const name = characterNameMap[type]?.get(id);
      if (name) return type === 'outside_character' ? `⭐ ${name}` : name;
      return type === 'outside_character'
        ? `⭐ #${character?.characterId ?? '?'}`
        : `#${character?.characterId ?? '?'}`;
    }
    function formatVocalCharacterNames(vocal) {
      const names = (vocal?.characters || []).map(getCharacterDisplayName).filter(Boolean);
      return names.length ? names.join(' / ') : '(无角色)';
    }
    function getStaffSummary(song) {
      return song.staffSummary || createEmptyStaffSummary();
    }
    function getSongVersionSummary(song) {
      const summary = song.videoVersionSummary || createEmptyVideoVersionSummary();
      return {
        bases: Array.isArray(summary.bases) ? summary.bases : [],
        special: Array.isArray(summary.special) ? summary.special : [],
        labels: Array.isArray(summary.labels) ? summary.labels : [],
      };
    }
    function getVersionLabel(versionKey, fallbackValue = '') {
      if (VIDEO_VERSION_CONFIG[versionKey]?.label) return VIDEO_VERSION_CONFIG[versionKey].label;
      if (fallbackValue === 'unknown') return '未分类';
      return fallbackValue || versionKey;
    }
    function getSongVersionFilterKeys(song) {
      const summary = getSongVersionSummary(song);
      const keys = [];
      summary.bases.forEach(base => {
        const key = `base:${base}`;
        if (VIDEO_VERSION_CONFIG[key]) keys.push(key);
      });
      summary.special.forEach(special => {
        const key = `special:${special}`;
        if (VIDEO_VERSION_CONFIG[key]) keys.push(key);
      });
      return Array.from(new Set(keys));
    }
    function getSongVersionLabels(song) {
      const summary = getSongVersionSummary(song);
      const labels = new Set(summary.labels || []);
      summary.bases.forEach(base => labels.add(getVersionLabel(`base:${base}`, base)));
      summary.special.forEach(special => labels.add(getVersionLabel(`special:${special}`, special)));
      return Array.from(labels);
    }
    function buildVersionBadgeItems(song) {
      const summary = getSongVersionSummary(song);
      const badges = [];
      const seen = new Set();

      summary.bases.forEach(base => {
        const key = `base:${base}`;
        if (seen.has(key)) return;
        seen.add(key);
        badges.push(`<span class="version-preview-badge base-${base}">${esc(getVersionLabel(key, base))}</span>`);
      });

      summary.special.forEach(special => {
        const key = `special:${special}`;
        if (seen.has(key)) return;
        seen.add(key);
        badges.push(`<span class="version-preview-badge special-${special}">${esc(getVersionLabel(key, special))}</span>`);
      });

      return badges;
    }
    function buildVersionPreviewHtml(song) {
      const badges = buildVersionBadgeItems(song);
      return badges.length ? `<div class="song-version-preview">${badges.join('')}</div>` : '';
    }
    function buildVersionDetailSection(song) {
      const badges = buildVersionBadgeItems(song);
      if (!badges.length) return '';
      return `<div class="detail-section">
            <div class="detail-label">视频版本</div>
            <div class="detail-badge-list">${badges.join('')}</div>
          </div>`;
    }
    function getStaffValues(song, roleKey) {
      const summary = getStaffSummary(song);
      if (roleKey === 'illustrator') return summary.illustrators || [];
      if (roleKey === 'pvCreator') return summary.pvCreators || [];
      return summary.otherRoles?.[roleKey] || [];
    }
    function getAllStaffNames(song) {
      const summary = getStaffSummary(song);
      const names = new Set();
      (summary.allContributors || []).forEach(item => {
        if (item?.name) names.add(item.name);
        if (item?.roleRaw) names.add(item.roleRaw);
      });
      STAFF_ROLE_ORDER.forEach(roleKey => {
        getStaffValues(song, roleKey).forEach(name => names.add(name));
        if (getStaffValues(song, roleKey).length) names.add(STAFF_ROLE_CONFIG[roleKey].label);
      });
      return Array.from(names);
    }
    function getFilterSet(type) {
      if (type === 'tag') return activeFilters.tags;
      if (type === 'cat') return activeFilters.categories;
      if (type === 'vocal') return activeFilters.vocalTypes;
      if (type === 'version') return activeFilters.videoVersions;
      if (type === 'staff') return activeFilters.staffRoles;
      return null;
    }
    function renderLoadingNotice(html) {
      document.getElementById('song-list').innerHTML = `<div class="loading">${html}</div>`;
    }
    function getLocalServerViewerUrl() {
      const fileName = location.pathname.split('/').pop() || 'music_viewer.html';
      return `http://localhost:8000/${fileName}`;
    }
    function handleFileProtocolAccess() {
      if (location.protocol !== 'file:') return false;
      const targetUrl = getLocalServerViewerUrl();
      renderLoadingNotice(
        `检测到你是直接打开本地 HTML 文件。<br>` +
        `浏览器会拦截对 JSON 的读取。<br><br>` +
        `请通过本地服务器访问：<a class="detail-link" href="${targetUrl}">${targetUrl}</a><br>` +
        `如果服务器已启动，页面将自动跳转；否则请先运行 <strong>start_server.bat</strong> 或 <strong>启动本地服务器.bat</strong>。`
      );
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 1200);
      return true;
    }
    function buildStaffDetailSection(song) {
      const staffItems = STAFF_ROLE_ORDER.map(roleKey => {
        const values = getStaffValues(song, roleKey);
        if (!values.length) return '';
        return `<div class="detail-item"><span class="label">${STAFF_ROLE_CONFIG[roleKey].label}</span> <span class="value">${esc(values.join(' / '))}</span></div>`;
      }).filter(Boolean).join('');

      if (!staffItems) return '';
      return `<div class="detail-section">
            <div class="detail-label">Staff 摘要</div>
            <div class="detail-grid">${staffItems}</div>
          </div>`;
    }
    function formatStaffPreviewValue(values) {
      if (!values.length) return '';
      const visibleValues = values.slice(0, 2);
      const remainingCount = values.length - visibleValues.length;
      const suffix = remainingCount > 0 ? ` +${remainingCount}` : '';
      return `${visibleValues.join(' / ')}${suffix}`;
    }
    function buildStaffPreviewHtml(song) {
      const selectedRoleKeys = STAFF_ROLE_ORDER.filter(roleKey => activeFilters.staffRoles.has(roleKey) && getStaffValues(song, roleKey).length);
      if (!selectedRoleKeys.length) return '';

      const previewItems = selectedRoleKeys.map(roleKey => {
        const values = getStaffValues(song, roleKey);
        return `<span class="staff-preview-item">
            <span class="staff-preview-label">${esc(STAFF_ROLE_CONFIG[roleKey].label)}</span>
            <span class="staff-preview-value">${esc(formatStaffPreviewValue(values))}</span>
          </span>`;
      }).join('');

      return `<div class="song-staff-preview">${previewItems}</div>`;
    }
    function getVisibleStaffRoleKeys(songs) {
      const selectedRoleKeys = STAFF_ROLE_ORDER.filter(roleKey => activeFilters.staffRoles.has(roleKey));
      if (selectedRoleKeys.length) return selectedRoleKeys;
      return STAFF_ROLE_ORDER.filter(roleKey => songs.some(song => getStaffValues(song, roleKey).length));
    }
    function buildStaffStats(songs) {
      const roleKeys = getVisibleStaffRoleKeys(songs);
      return roleKeys.map(roleKey => {
        const counts = new Map();
        songs.forEach(song => {
          getStaffValues(song, roleKey).forEach(name => {
            counts.set(name, (counts.get(name) || 0) + 1);
          });
        });
        const topEntries = Array.from(counts.entries())
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'))
          .slice(0, 8);
        return {
          roleKey,
          roleLabel: STAFF_ROLE_CONFIG[roleKey].label,
          uniqueCount: counts.size,
          topEntries,
        };
      });
    }
    function renderStaffStats(songs) {
      const subtitle = document.getElementById('staff-stats-subtitle');
      const grid = document.getElementById('staff-stats-grid');
      const stats = buildStaffStats(songs);
      subtitle.textContent = `基于当前结果统计 · ${songs.length} 首歌曲`;

      if (!stats.length) {
        grid.innerHTML = '<div class="staff-stat-card"><div class="staff-stat-empty">当前结果里没有可统计的 Staff 字段。</div></div>';
        return;
      }

      grid.innerHTML = stats.map(stat => {
        const rows = stat.topEntries.length
          ? stat.topEntries.map(([name, count], index) => `
              <div class="staff-stat-row">
                <div class="staff-stat-rank">${index + 1}</div>
                <div class="staff-stat-name" title="${esc(name)}">${esc(name)}</div>
                <div class="staff-stat-count">${count}</div>
              </div>
            `).join('')
          : '<div class="staff-stat-empty">当前结果里没有这个字段。</div>';

        return `
          <div class="staff-stat-card${activeFilters.staffRoles.has(stat.roleKey) ? ' active-role' : ''}">
            <div class="staff-stat-card-header">
              <div class="staff-stat-role">${esc(stat.roleLabel)}</div>
              <div class="staff-stat-meta">${stat.uniqueCount} 人</div>
            </div>
            <div class="staff-stat-list">${rows}</div>
          </div>
        `;
      }).join('');
    }
    function mergeSupplementalSongData(baseSongs, databaseV2) {
      const supplementalMap = new Map();
      (databaseV2?.songs || []).forEach(song => {
        supplementalMap.set(song.title, {
          staffSummary: song.staffSummary || createEmptyStaffSummary(),
          videoVersionSummary: song.videoVersionSummary || createEmptyVideoVersionSummary(),
        });
      });
      return baseSongs.map(song => ({
        ...song,
        staffSummary: supplementalMap.get(song.title)?.staffSummary || createEmptyStaffSummary(),
        videoVersionSummary: supplementalMap.get(song.title)?.videoVersionSummary || createEmptyVideoVersionSummary(),
      }));
    }

    function renderFilters() {
      const tagCounts = {}, catCounts = {}, vocalCounts = {}, versionCounts = {}, staffCounts = {};
      allSongs.forEach(s => {
        getDisplayTags(s.tags).forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1);
        (s.categories || []).forEach(c => catCounts[c] = (catCounts[c] || 0) + 1);
        (s.vocals || []).forEach(v => vocalCounts[v.musicVocalType] = (vocalCounts[v.musicVocalType] || 0) + 1);
        getSongVersionFilterKeys(s).forEach(key => versionCounts[key] = (versionCounts[key] || 0) + 1);
        STAFF_ROLE_ORDER.forEach(roleKey => {
          if (getStaffValues(s, roleKey).length) {
            staffCounts[roleKey] = (staffCounts[roleKey] || 0) + 1;
          }
        });
      });

      const mkFilter = (container, items, counts, labels, type, colorMap) => {
        document.getElementById(container).innerHTML = items.filter(k => counts[k]).map(k => {
          const label = labels[k]?.label || labels[k] || k;
          const color = colorMap?.[k];
          const dot = color ? `<span class="filter-dot" style="background:${color}"></span>` : '';
          const activeSet = getFilterSet(type);
          const checked = activeSet?.has(k);
          return `<label class="filter-item${checked ? ' active' : ''}" data-filter="${type}" data-value="${k}">
            <input type="checkbox"${checked ? ' checked' : ''}>${dot}${label}<span class="filter-count">${counts[k]}</span></label>`;
        }).join('');
      };

      mkFilter('tag-filters',
        ['light_music_club', 'idol', 'street', 'theme_park', 'school_refusal', 'vocaloid', 'other'],
        tagCounts, TAG_CONFIG, 'tag', Object.fromEntries(Object.entries(TAG_CONFIG).map(([k, v]) => [k, v.color])));
      mkFilter('cat-filters', ['mv', 'mv_2d', 'image', 'original'], catCounts, CAT_LABELS, 'cat', null);
      mkFilter('vocal-filters',
        ['original_song', 'sekai', 'another_vocal', 'virtual_singer', 'instrumental', 'april_fool_2022', 'streaming_live'],
        vocalCounts, VOCAL_LABELS, 'vocal', null);
      mkFilter('version-filters', VIDEO_VERSION_ORDER, versionCounts, VIDEO_VERSION_CONFIG, 'version', null);
      mkFilter('staff-filters', STAFF_ROLE_ORDER, staffCounts, STAFF_ROLE_CONFIG, 'staff', null);

      document.querySelectorAll('[data-filter]').forEach(el => {
        el.addEventListener('change', () => {
          const { filter: type, value } = el.dataset;
          const checked = el.querySelector('input').checked;
          const set = getFilterSet(type);
          if (!set) return;
          checked ? set.add(value) : set.delete(value);
          el.classList.toggle('active', checked);
          applyFilters();
        });
      });
    }

    // Build a lookup map for quick access by id
    let songMap = {};

    function buildDetailHtml(s) {
      return `<div class="song-detail show" id="detail-${s.id}">
          <div class="detail-section">
            <div class="detail-label">创作者信息</div>
            <div class="detail-grid">
              <div class="detail-item"><span class="label">作词</span> <span class="value">${esc(s.creators?.lyricist || '-')}</span></div>
              <div class="detail-item"><span class="label">作曲</span> <span class="value">${esc(s.creators?.composer || '-')}</span></div>
              <div class="detail-item"><span class="label">编曲</span> <span class="value">${esc(s.creators?.arranger || '-')}</span></div>
              <div class="detail-item"><span class="label">艺术家</span> <span class="value">${esc(s.creators?.creatorArtistName || '-')}</span></div>
            </div>
          </div>
          <div class="detail-section">
            <div class="detail-label">时间</div>
            <div class="detail-grid">
              <div class="detail-item"><span class="label">实装时间</span> <span class="value">${formatDate(s.publishedAt)}</span></div>
              <div class="detail-item"><span class="label">原曲发布</span> <span class="value">${formatDate(s.releasedAt)}</span></div>
            </div>
          </div>
          ${s.originalVideoLink ? `<div class="detail-section">
            <div class="detail-label">原曲链接</div>
            <div class="detail-item">
              <a class="detail-link" href="${esc(s.originalVideoLink)}" target="_blank" rel="noopener noreferrer">${esc(s.originalVideoLink)}</a>
            </div>
          </div>` : ''}
          ${(aliasMap[s.id] && aliasMap[s.id].length > 0) ? `<div class="detail-section">
            <div class="detail-label">别称</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">${aliasMap[s.id].map(a =>
              `<span style="padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(155,109,255,0.15);color:#9b6dff">${esc(a)}</span>`
            ).join('')}</div>
          </div>` : ''}
          ${buildVersionDetailSection(s)}
          ${buildStaffDetailSection(s)}
          <div class="detail-section">
            <div class="detail-label">歌声版本 (${(s.vocals || []).length})</div>
            <div class="vocal-list">${(s.vocals || []).map(v => {
        const chars = formatVocalCharacterNames(v);
        return `<div class="vocal-item">
                <span class="vocal-type-badge vt-${v.musicVocalType}">${VOCAL_LABELS[v.musicVocalType] || v.musicVocalType}</span>
                <span class="vocal-caption">${esc(v.caption)}</span>
                <span class="vocal-chars">${chars || '(无角色)'}</span>
              </div>`;
      }).join('')}</div>
          </div>
        </div>`;
    }

    function buildRowHtml(s) {
      const tags = getDisplayTags(s.tags);
      const tagsHtml = tags.map(t => `<span class="tag tag-${TAG_CONFIG[t] ? t : 'other'}">${TAG_CONFIG[t]?.label || t}</span>`).join('');
      const catsHtml = (s.categories || []).map(c => `<span class="cat-badge cat-${c}">${CAT_LABELS[c] || c}</span>`).join('');
      const versionPreviewHtml = buildVersionPreviewHtml(s);
      const staffPreviewHtml = buildStaffPreviewHtml(s);
      return `<div class="song-row" data-id="${s.id}">
        <span class="song-id">#${s.id}</span>
        <div class="song-title-col">
          <div class="song-title">${esc(s.title)}</div>
          <div class="song-creator">${esc(s.creators?.creatorArtistName || s.creators?.composer || '-')}</div>
          ${versionPreviewHtml}
          ${staffPreviewHtml}
        </div>
        <div class="song-tags">${tagsHtml}</div>
        <div class="song-categories">${catsHtml}</div>
        <div class="song-date">${formatDate(s.publishedAt)}</div>
        <div class="expand-arrow">▶</div>
      </div>`;
    }

    function renderSongList() {
      const container = document.getElementById('song-list');
      if (!filteredSongs.length) { container.innerHTML = '<div class="loading">没有找到匹配的歌曲</div>'; updateLoadMore(); return; }

      // Only render first page of rows
      const pageItems = filteredSongs.slice(0, visibleCount);
      container.innerHTML = pageItems.map(buildRowHtml).join('');
      updateLoadMore();
      bindListClick(container);
    }

    function loadMore() {
      const container = document.getElementById('song-list');
      const from = visibleCount;
      visibleCount = Math.min(visibleCount + PAGE_SIZE, filteredSongs.length);
      const newItems = filteredSongs.slice(from, visibleCount);
      container.insertAdjacentHTML('beforeend', newItems.map(buildRowHtml).join(''));
      updateLoadMore();
    }

    function updateLoadMore() {
      const bar = document.getElementById('load-more-bar');
      const btn = document.getElementById('load-more-btn');
      if (visibleCount < filteredSongs.length) {
        bar.style.display = '';
        btn.textContent = `加载更多 (${visibleCount}/${filteredSongs.length})`;
      } else {
        bar.style.display = 'none';
      }
    }

    function bindListClick(container) {
      container.onclick = (e) => {
        const row = e.target.closest('.song-row');
        if (!row) return;
        const id = parseInt(row.dataset.id);

        if (expandedId === id) {
          expandedId = null;
          row.classList.remove('expanded');
          const detail = document.getElementById(`detail-${id}`);
          if (detail) detail.remove();
        } else {
          if (expandedId !== null) {
            const prevRow = container.querySelector(`.song-row[data-id="${expandedId}"]`);
            if (prevRow) prevRow.classList.remove('expanded');
            const prevDetail = document.getElementById(`detail-${expandedId}`);
            if (prevDetail) prevDetail.remove();
          }
          expandedId = id;
          row.classList.add('expanded');
          const s = songMap[id];
          if (s) row.insertAdjacentHTML('afterend', buildDetailHtml(s));
        }
      };
    }

    function updateBackToTopButton() {
      const btn = document.getElementById('back-to-top-btn');
      if (!btn) return;
      btn.classList.toggle('visible', window.scrollY > 320);
    }

    function bindBackToTopButton() {
      const btn = document.getElementById('back-to-top-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      window.addEventListener('scroll', updateBackToTopButton, { passive: true });
      updateBackToTopButton();
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      filteredSongs = allSongs.filter(s => {
        if (q) {
          const fields = [
            s.title,
            s.creators?.creatorArtistName,
            s.creators?.lyricist,
            s.creators?.composer,
            ...getAllStaffNames(s),
            ...getSongVersionLabels(s),
            ...getSongVersionSummary(s).bases,
            ...getSongVersionSummary(s).special,
          ].map(f => (f || '').toLowerCase());
          const songAliases = aliasMap[s.id] || [];
          if (!fields.some(f => f.includes(q)) && !songAliases.some(a => a.toLowerCase().includes(q))) return false;
        }
        if (activeFilters.tags.size && !getDisplayTags(s.tags).some(t => activeFilters.tags.has(t))) return false;
        if (activeFilters.categories.size && !(s.categories || []).some(c => activeFilters.categories.has(c))) return false;
        if (activeFilters.vocalTypes.size && !(s.vocals || []).some(v => activeFilters.vocalTypes.has(v.musicVocalType))) return false;
        if (activeFilters.videoVersions.size) {
          const versionKeys = new Set(getSongVersionFilterKeys(s));
          if (![...activeFilters.videoVersions].every(key => versionKeys.has(key))) return false;
        }
        if (activeFilters.staffRoles.size && !STAFF_ROLE_ORDER.some(roleKey => activeFilters.staffRoles.has(roleKey) && getStaffValues(s, roleKey).length)) return false;
        return true;
      });
      filteredSongs.sort((a, b) => {
        let va = a[sortField], vb = b[sortField];
        if (sortField === 'title') { va = (va || '').toLowerCase(); vb = (vb || '').toLowerCase(); }
        if (va < vb) return sortAsc ? -1 : 1;
        if (va > vb) return sortAsc ? 1 : -1;
        return 0;
      });
      document.getElementById('stat-filtered').textContent = filteredSongs.length;
      document.getElementById('results-info').textContent = `显示 ${filteredSongs.length} / ${allSongs.length} 首歌曲`;
      expandedId = null;
      visibleCount = PAGE_SIZE;
      renderStaffStats(filteredSongs);
      renderSongList();
    }

    async function init() {
      if (handleFileProtocolAccess()) return;
      try {
        const [resp, databaseResp, gameCharactersResp, outsideCharactersResp] = await Promise.all([
          fetch('output/combined_music_data.json'),
          fetch('output/database_v2.json').catch(() => null),
          fetch('sekai-master-db-diff-main/gameCharacters.json').catch(() => null),
          fetch('sekai-master-db-diff-main/outsideCharacters.json').catch(() => null),
        ]);
        const baseSongs = await resp.json();
        let databaseV2 = null;
        let gameCharacters = [];
        let outsideCharacters = [];
        if (databaseResp && databaseResp.ok) {
          databaseV2 = await databaseResp.json();
        }
        if (gameCharactersResp && gameCharactersResp.ok) {
          gameCharacters = await gameCharactersResp.json();
        }
        if (outsideCharactersResp && outsideCharactersResp.ok) {
          outsideCharacters = await outsideCharactersResp.json();
        }
        characterNameMap = buildCharacterNameLookup(gameCharacters, outsideCharacters);
        allSongs = mergeSupplementalSongData(baseSongs, databaseV2);
      } catch (e) {
        renderLoadingNotice(`加载失败：${e.message}<br>请确保 output 目录中的 JSON 文件存在，并通过 HTTP 服务器访问当前页面。`);
        return;
      }
      // Load alias data
      try {
        const aliasResp = await fetch('output/aliases.json');
        const aliasData = await aliasResp.json();
        Object.entries(aliasData).forEach(([id, aliasList]) => {
          aliasMap[parseInt(id)] = Array.isArray(aliasList) ? aliasList : [];
        });
      } catch(e) { /* aliases.json not found, skip */ }
      document.getElementById('stat-total').textContent = allSongs.length;
      allSongs.forEach(s => songMap[s.id] = s);
      renderFilters();
      applyFilters();

      document.getElementById('load-more-btn').addEventListener('click', loadMore);

      let timer;
      document.getElementById('search-input').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(applyFilters, 200); });

      document.querySelectorAll('.list-header span[data-sort]').forEach(el => {
        el.addEventListener('click', () => {
          const f = el.dataset.sort;
          if (sortField === f) sortAsc = !sortAsc; else { sortField = f; sortAsc = true; }
          document.querySelectorAll('.sort-indicator').forEach(si => si.textContent = '');
          const ind = document.getElementById(`sort-${f}`);
          if (ind) ind.textContent = sortAsc ? '▲' : '▼';
          applyFilters();
        });
      });

      bindBackToTopButton();
    }
    init();
  </script>
</body>

</html>
